services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: socioai
      POSTGRES_PASSWORD: socioai
      POSTGRES_DB: socioai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socioai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:

