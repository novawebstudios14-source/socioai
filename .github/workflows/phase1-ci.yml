name: Phase 3 CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: socioai
          POSTGRES_PASSWORD: test
          POSTGRES_DB: socioai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socioai -d socioai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://socioai:test@localhost:5432/socioai_test
      TEST_DATABASE_URL: postgresql+psycopg://socioai:test@localhost:5432/socioai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Validate local Docker Compose
        env:
          POSTGRES_PASSWORD: testpassword
          EVOLUTION_API_KEY: test-evolution-key
          EVOLUTION_WEBHOOK_SECRET: test-webhook-key
          ADMIN_API_KEY: test-admin-key
          GROQ_API_KEY: test-groq-key
        run: |
          cp .env.local.example .env
          docker compose -f docker-compose.yml -f docker-compose.local.yml config >/dev/null
          ! docker compose -f docker-compose.yml -f docker-compose.local.yml config --services | grep -qx caddy
      - name: Validate clean migration cycle
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Run fast tests
        run: pytest -m "not postgres"
      - name: Run PostgreSQL integration test
        run: pytest -m postgres
