[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socioai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pgvector>=0.3,<1",
  "pypdf>=5,<7",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "reportlab>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/socioai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: PostgreSQL migration and constraint integration tests"]
